<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tarte-aux-etrons — playground</title>
  <link rel="stylesheet" href="https://unpkg.com/chicken-player@1.5.0/dist/chicken-player.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #fafafa;
      color: #111;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem 8rem;
      gap: 2rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: clamp(1.5rem, 5vw, 2.25rem);
      font-weight: 800;
      letter-spacing: -.02em;
    }

    header p {
      margin-top: .4rem;
      color: #6b7280;
      font-size: .925rem;
    }

    header a {
      color: #6b7280;
      text-decoration: none;
    }

    header a:hover {
      color: #111;
    }

    .section {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }

    .section-label {
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #9ca3af;
    }

    /* ── Boutons de contrôle ── */
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .5rem;
    }

    button {
      padding: .55rem .75rem;
      border-radius: .5rem;
      border: 1px solid #e5e7eb;
      background: #fff;
      cursor: pointer;
      font-size: .8rem;
      font-weight: 600;
      color: #374151;
      transition: background .15s, border-color .15s;
      white-space: nowrap;
    }

    button:hover {
      background: #f3f4f6;
      border-color: #d1d5db;
    }

    button.primary {
      background: #1d4ed8;
      border-color: #1d4ed8;
      color: #fff;
    }

    button.primary:hover {
      background: #1e40af;
      border-color: #1e40af;
    }

    button.danger {
      background: #fff;
      border-color: #fca5a5;
      color: #dc2626;
    }

    button.danger:hover {
      background: #fef2f2;
    }

    /* ── Vidéo YouTube ── */
    .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      border-radius: .75rem;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .video-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      color: #9ca3af;
      font-size: .875rem;
      pointer-events: none;
    }

    .video-placeholder span {
      font-size: 2rem;
    }

    /* ── État JSON ── */
    pre {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 1rem 1.25rem;
      border-radius: .75rem;
      font-size: .775rem;
      line-height: 1.6;
      overflow: auto;
      width: 100%;
    }

    /* Cache le placeholder dès que l'iframe a un src actif */
    .video-wrapper:has(iframe[src]:not([src=""])) .video-placeholder {
      display: none;
    }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>💩 tarte-aux-etrons</h1>
    <p>Parce que les cookies, c'est de la merde. · <a href="https://tarteauxetrons.creative-bones.com/docs" target="_blank" rel="noopener">Documentation</a> · <a href="https://github.com/davidessayan/tarte-aux-etrons" target="_blank" rel="noopener">GitHub</a></p>
  </header>

  <div class="section">
    <span class="section-label">Contrôles</span>
    <div class="controls">
      <button class="primary" id="btn-accept">Tout gober</button>
      <button class="danger" id="btn-refuse">Tirer la chasse</button>
      <button id="btn-reset">Trier les étrons 🪠</button>
    </div>
  </div>

  <div class="section">
    <span class="section-label">YouTube (data-src)</span>
    <div class="video-wrapper">
      <div class="video-placeholder">
        <span>🎬</span>
        <p>Acceptez les cookies pour voir la vidéo</p>
      </div>
      <iframe
        data-src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ"
        allowfullscreen
      ></iframe>
    </div>
  </div>

  <div class="section">
    <span class="section-label">Chicken Player</span>
    <div class="chicken-player" data-type="youtube" data-id="dQw4w9WgXcQ"></div>
  </div>

  <div class="section">
    <span class="section-label">État du consentement</span>
    <pre id="state-output">En attente...</pre>
  </div>

  <script src="https://unpkg.com/chicken-player@1.5.0/dist/chicken-player.umd.js"></script>
  <script>
    new window.ChickenPlayer({ cookies: { active: true } })
  </script>
  <script type="module" src="./main.ts"></script>
</body>

</html>
